{% if appointment.is_auto and appointment.match_percent != None %}<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-primary-fixed text-on-primary-fixed font-label-sm text-label-sm font-semibold" title="Attribué par le moteur de matching IA"><span class="material-symbols-outlined text-[14px]">auto_awesome</span>Matching IA · {{ appointment.match_percent }} %</span>{% endif %}
{% if appointment.match_info.by == "provider" %}<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm font-semibold" title="Le prestataire a choisi d'intervenir sur cette demande"><span class="material-symbols-outlined text-[14px]">handyman</span>Pris par le prestataire</span>{% endif %}
